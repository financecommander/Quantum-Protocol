version: '3.8'

services:
  # Quantum Protocol HFT Engine
  quantum-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quantum-engine
    restart: unless-stopped
    ports:
      - "9090:9090"    # Prometheus metrics
      - "9999:9999/udp" # UDP market data
    volumes:
      - audit-logs:/var/log/quantum-protocol
      - ./config:/etc/quantum-protocol:ro
    env_file:
      - .env
    environment:
      - QP_CONFIG=/etc/quantum-protocol/quantum_protocol.toml
      - RUST_LOG=info
    networks:
      - quantum-net
    depends_on:
      - prometheus

  # Prometheus metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: quantum-prometheus
    restart: unless-stopped
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    networks:
      - quantum-net

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: quantum-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - quantum-net
    depends_on:
      - prometheus

volumes:
  audit-logs:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  quantum-net:
    driver: bridge
