name: Quantum Protocol CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-engine:
    name: "Layer 1: Python Engine + Brain"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run engine parity tests
        run: pytest tests/test_engine_parity.py -v

      - name: Run engine state tests
        run: pytest tests/test_engine_state.py -v

      - name: Run market data feed tests
        run: pytest tests/test_market_data_feed.py -v

      - name: Run Terra Luna full replay
        run: pytest tests/test_terra_luna_full.py -v

      - name: Run Terra Luna legacy replay
        run: python tests/terra_luna_replay.py

  python-platform:
    name: "Layer 2: Python Platform"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run platform tests
        run: pytest src/dashboard/tests/ -v

  python-brain:
    name: "Layer 3: Brain Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run brain tests
        run: pytest brain/tests/ -v

  quantum-oracle:
    name: "Layer 4: Quantum Oracle (CI)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run quantum training (classical fallback)
        run: python scripts/quantum_training.py --num-assets 4 --iterations 10 --output /tmp/test_weights.json

      - name: Verify weights output
        run: python -c "import json; d=json.load(open('/tmp/test_weights.json')); assert len(d['weights'])==4; print('Weights OK:', d['weights'])"
