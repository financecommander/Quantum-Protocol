name: Quantum Protocol CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  rust-engine:
    name: "Layer 1: Rust Engine"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose

      - name: Check formatting
        run: cargo fmt -- --check

      - name: Clippy lints
        run: cargo clippy -- -D warnings

  python-platform:
    name: "Layer 2: Python Platform"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run platform tests
        run: pytest src/dashboard/tests/ -v

      - name: Run Terra Luna replay
        run: python tests/terra_luna_replay.py

  quantum-oracle:
    name: "Layer 3: Quantum Oracle (CI)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run quantum training (classical fallback)
        run: python scripts/quantum_training.py --num-assets 4 --iterations 10 --output /tmp/test_weights.json

      - name: Verify weights output
        run: python -c "import json; d=json.load(open('/tmp/test_weights.json')); assert len(d['weights'])==4; print('Weights OK:', d['weights'])"
