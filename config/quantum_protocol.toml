# Quantum Protocol Engine Configuration
# ============================================
# Environment variable substitution: use ${ENV_VAR} syntax

[engine]
tick_interval_seconds = 10.0
market_data_timeout_seconds = 10.0
max_position = 1000000.0
hedge_ratio = 0.8
circuit_breaker_enabled = true
portfolio_value = 50000.0

# ---------------------------------------------------------------------------
# Trading Sleeves
# ---------------------------------------------------------------------------

[sleeves.treasury_basis]
enabled = true
weight = 0.125

[sleeves.vol_regime]
enabled = true
threshold_low = 15.0
threshold_high = 30.0

[sleeves.prop_scaling]
enabled = true
max_accounts = 32
min_equity = 2000.0
master_account_id = "${IBKR_MASTER_ACCOUNT}"
prop_accounts = []

[sleeves.rwa_crypto]
enabled = true
min_spread_bps = 5.0
fee_bps = 2.0
max_position_usd = 50000.0
symbols = ["BTC", "ETH", "SOL"]

[sleeves.tail_hedging]
enabled = true
vix_critical_threshold = 45.0

# ---------------------------------------------------------------------------
# Risk Management
# ---------------------------------------------------------------------------

[risk]
max_position_per_symbol = 100000.0
max_portfolio_position = 5000000.0
max_daily_loss = 50000.0
max_consecutive_rejections = 10

# ---------------------------------------------------------------------------
# Monitoring
# ---------------------------------------------------------------------------

[monitoring]
dashboard_port = 8000
streamlit_port = 8501
audit_log_dir = "/var/log/quantum"
audit_retention_days = 2555  # ~7 years (FINRA 3110)

# ---------------------------------------------------------------------------
# Data Feeds
# ---------------------------------------------------------------------------

[feeds]
provider = "alpaca"  # alpaca | mock
alpaca_api_key = "${ALPACA_API_KEY}"
alpaca_secret_key = "${ALPACA_SECRET_KEY}"
symbols = ["SPY", "TLT", "IEF", "UUP", "VIXY"]

# ---------------------------------------------------------------------------
# Alerts
# ---------------------------------------------------------------------------

[alerts]
slack_webhook_url = "${QP_SLACK_WEBHOOK}"
email_to = "${QP_ALERT_EMAIL}"
cooldown_secs = 300
