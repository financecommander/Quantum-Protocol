[package]
name = "quantum-protocol"
version = "0.1.0"
edition = "2021"
description = "Quantum Protocol HFT Engine - Layer 1 Iron Core"

[[bin]]
name = "quantum-engine"
path = "src/engine/main.rs"

[dependencies]
log = "0.4"
env_logger = "0.11"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
anyhow = "1.0"
thiserror = "1.0"
prometheus = "0.13"
notify = "6.0"
reqwest = { version = "0.11", features = ["json"] }
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
hyper = { version = "1", features = ["server", "http1"] }
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["tokio"] }
regex = "1.10"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.8"

[[bench]]
name = "latency_bench"
harness = false

[[bench]]
name = "prop_scaling_bench"
harness = false

[[bench]]
name = "rwa_crypto_bench"
harness = false

[[bench]]
name = "tail_hedging_bench"
harness = false

