[package]
name = "quantum-protocol"
version = "0.1.0"
edition = "2021"
description = "Quantum Protocol HFT Engine - Layer 1 Iron Core"

[[bin]]
name = "quantum-engine"
path = "src/engine/main.rs"

[dependencies]
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
notify = "7.0"
futures-util = "0.3"
regex = "1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "latency_bench"
harness = false

[[bench]]
name = "prop_scaling_bench"
harness = false

[[bench]]
name = "rwa_crypto_bench"
harness = false

[[bench]]
name = "tail_hedging_bench"
harness = false

